<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="loganalyzer {{ version }}">
<title>{% block title %}{% endblock %}</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #ffffff;
  --surface-2: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --series: #2a78d6;
  --alert: #d03b3b;
  --sev-critical: #d03b3b;
  --sev-high: #ec835a;
  --sev-medium: #fab219;
  --sev-low: #898781;
  --code-bg: #f3f2ee;
  --div-neg-4: #1c5cab; --div-neg-3: #3987e5; --div-neg-2: #86b6ef; --div-neg-1: #cde2fb;
  --div-mid: #f0efec;
  --div-pos-1: #f9d4d1; --div-pos-2: #ee9a96; --div-pos-3: #e05a57; --div-pos-4: #b4302f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #1f1f1e;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
    --series: #3987e5; --code-bg: #232322;
    --div-neg-4: #9ec5f4; --div-neg-3: #5598e7; --div-neg-2: #256abf; --div-neg-1: #184f95;
    --div-mid: #383835;
    --div-pos-1: #7a2a29; --div-pos-2: #b4302f; --div-pos-3: #e05a57; --div-pos-4: #f2a6a3;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #1f1f1e;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
  --series: #3987e5; --code-bg: #232322;
  --div-neg-4: #9ec5f4; --div-neg-3: #5598e7; --div-neg-2: #256abf; --div-neg-1: #184f95;
  --div-mid: #383835;
  --div-pos-1: #7a2a29; --div-pos-2: #b4302f; --div-pos-3: #e05a57; --div-pos-4: #f2a6a3;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 32px 24px 56px; }
header.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
h1 { font-size: 26px; line-height: 1.2; margin: 0; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 16px; margin: 0 0 4px; font-weight: 650; }
.sub { color: var(--ink-2); margin: 0 0 14px; font-size: 13px; }
.meta { color: var(--ink-2); font-size: 13px; text-align: right; }
.meta div { white-space: nowrap; }
.mono, code, pre { font-family: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, monospace; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
section { margin-top: 20px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.kpi .label { color: var(--ink-2); font-size: 13px; }
.kpi .value { font-size: 28px; font-weight: 650; letter-spacing: -.01em; margin-top: 2px; }
.kpi .note { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.segbar { display: flex; gap: 2px; height: 8px; margin: 10px 0 8px; }
.segbar span { border-radius: 4px; min-width: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--ink-2); }
.legend i, .sev i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.sev { display: inline-flex; align-items: center; white-space: nowrap; font-size: 12px; font-weight: 600;
       padding: 2px 9px 2px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); }
.c-critical { background: var(--sev-critical); } .c-high { background: var(--sev-high); }
.c-medium { background: var(--sev-medium); } .c-low, .c-info { background: var(--sev-low); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table-scroll { overflow-x: auto; }
.finding-title { font-weight: 600; }
.finding-desc { color: var(--ink-2); margin-top: 2px; }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
pre.evidence { margin: 6px 0 0; padding: 10px 12px; background: var(--code-bg); border-radius: 8px; font-size: 12px;
               line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
a { color: var(--series); text-decoration: none; }
a:hover { text-decoration: underline; }
.when { white-space: nowrap; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 12px 0; }

svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .axis { stroke: var(--axis); stroke-width: 1; }
svg .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .label { fill: var(--ink-2); font-size: 12px; }
svg .label.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px; }
svg .value { fill: var(--ink-2); font-size: 11.5px; font-variant-numeric: tabular-nums; }
svg .bar { fill: var(--series); }
svg .bar.alert, svg .dot.alert { fill: var(--alert); }
svg .dot { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
svg .frame { fill: none; stroke: var(--grid); }
svg .hit:hover .bar, svg .hit:hover .dot { opacity: .78; }
svg .cell.mid { fill: var(--div-mid); }
svg .cell.neg1 { fill: var(--div-neg-1); } svg .cell.neg2 { fill: var(--div-neg-2); }
svg .cell.neg3 { fill: var(--div-neg-3); } svg .cell.neg4 { fill: var(--div-neg-4); }
svg .cell.pos1 { fill: var(--div-pos-1); } svg .cell.pos2 { fill: var(--div-pos-2); }
svg .cell.pos3 { fill: var(--div-pos-3); } svg .cell.pos4 { fill: var(--div-pos-4); }
svg .cellv { font-size: 11px; font-variant-numeric: tabular-nums; }
svg .ink-dark { fill: #0b0b0b; } svg .ink-light { fill: #ffffff; }
.chart-legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 10px; }
footer { color: var(--muted); font-size: 12.5px; margin-top: 28px; text-align: center; }

@media (max-width: 640px) {
  .wrap { padding: 20px 16px 40px; }
  .meta { text-align: left; }
  .meta div { white-space: normal; }
  h1 { font-size: 22px; }
}
@media print {
  body { background: #fff; }
  .card, .kpi { break-inside: avoid; }
  details { display: block; }
}
</style>
</head>
<body>
<div class="wrap">
{% block body %}{% endblock %}
<footer>Generated by loganalyzer {{ version }}</footer>
</div>
</body>
</html>
