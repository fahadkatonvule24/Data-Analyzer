[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loganalyzer"
version = "2.0.0"
description = "Security log analysis for SSH auth logs and web access logs, with rule-based detections mapped to MITRE ATT&CK and ML anomaly detection."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kato Fahad Nvule" }]
keywords = ["security", "log-analysis", "siem", "blue-team", "anomaly-detection", "mitre-attack"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Intended Audience :: Information Technology",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[project.scripts]
loganalyzer = "loganalyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loganalyzer = ["report/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Line length is enforced by `ruff format`; long string literals are left intact.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
